<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Command Hub</title>
<meta name="description" content="AI Command Hub — Claude, Grok, Codex, Gemini, Ollama and more. HE / EN / RU.">
<meta name="theme-color" content="#b5502e">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ee;--panel:#fffdf8;--soft:#efeadd;--ink:#231e16;--muted:#75695a;
  --line:#e3ddcd;--accent:#b5502e;
  --accent-soft:color-mix(in oklab,var(--accent) 13%,var(--panel));
  --accent-ink:color-mix(in oklab,var(--accent) 78%,var(--ink));
  --gold:#a8760f;--gold-soft:color-mix(in oklab,#a8760f 14%,var(--panel));
  --gold-ink:color-mix(in oklab,#a8760f 80%,var(--ink));
  --claude:#b5502e;--grok:#8b5cf6;--codex:#eab308;--gemini:#3b82f6;--deepseek:#06b6d4;
  --crush:#ec4899;--ollama:#64748b;--opencode:#14b8a6;--notebooklm:#a855f7;--hub:#b5502e;--free:#16a34a;--shared:#7a4a9e;
  --shadow:0 1px 2px rgba(30,20,10,.04),0 5px 16px rgba(30,20,10,.06);
  --card-pad:14px 16px;--radius:14px;
  color-scheme:light;
}
html[data-theme="dark"]{
  --bg:#171410;--panel:#211c15;--soft:#2a2318;--ink:#ece6d9;--muted:#a69c89;
  --line:#382f22;--accent:#e8935a;--gold:#e0b83d;
  --gold-soft:color-mix(in oklab,#e0b83d 16%,var(--panel));
  --gold-ink:color-mix(in oklab,#e0b83d 82%,var(--ink));
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  color-scheme:dark;
}
html[data-density="compact"]{--card-pad:9px 11px}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--ink);font-family:Heebo,system-ui,Segoe UI,Arial,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
button,input,select{font-family:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
mark.hl{background:color-mix(in oklab,var(--gold) 35%,transparent);border-radius:3px;padding:0 2px}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes flashCopy{0%,100%{box-shadow:var(--shadow)}50%{box-shadow:0 0 0 4px var(--accent-soft)}}
@keyframes fadeUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.site-header{position:sticky;top:0;z-index:30;background:color-mix(in oklab,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1360px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--accent);color:#fff;display:grid;place-items:center;font-family:JetBrains Mono,monospace;font-weight:600;font-size:14px;direction:ltr}
.brand-title{font-weight:800;font-size:15px}.brand-sub{font-size:11px;color:var(--muted)}
.mode-switch{display:flex;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px}
.mode-switch button{border:none;background:transparent;padding:6px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--muted)}
.mode-switch button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.search-wrap{flex:1 1 180px;max-width:420px;position:relative;margin-inline:auto}
.search-wrap input{width:100%;padding:9px 36px 9px 38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);outline:none}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search-wrap svg{position:absolute;inset-inline-start:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
.icon-btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;width:36px;height:36px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover,.icon-btn.on{border-color:var(--accent);color:var(--accent-ink)}
/* Pre-existing bug found 2026-07-31 while testing Phase 7: .icon-btn's
   unconditional `display:grid` was overriding the browser's default
   `[hidden]{display:none}`, so desktopProjectBtn/dbDebugBtn/boxChatBtn
   (all Tauri-only, meant to stay hidden on a plain web build) were
   actually visible in any regular browser. This restores the attribute's
   intended effect regardless of what display value a class sets. */
[hidden]{display:none!important}
.menu-btn{display:none}

/* SIMPLE HOME */
.simple-wrap{max-width:1100px;margin:0 auto;padding:20px 16px 60px}
.hero{text-align:center;margin-bottom:22px}
.hero h1{margin:0;font-size:clamp(1.4rem,3vw,1.9rem);font-weight:800}
.hero p{margin:8px 0 0;color:var(--muted);font-size:15px;max-width:520px;margin-inline:auto}
.steps{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 22px}
.step{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;box-shadow:var(--shadow)}
.step b{color:var(--accent-ink);margin-inline-end:4px}
.action-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:28px}
.action-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;text-align:start;box-shadow:var(--shadow);transition:.15s;font:inherit;color:inherit}
.action-card:hover{border-color:var(--accent);transform:translateY(-2px)}
.action-card .ic{font-size:22px;margin-bottom:6px}
.action-card h3{margin:0 0 4px;font-size:15px}
.action-card p{margin:0;color:var(--muted);font-size:12.5px}
.section-title{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em;margin:0 0 12px}
.model-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.model-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;animation:fadeUp .25s ease}
.model-card header{display:flex;align-items:center;gap:10px}
.model-dot{width:12px;height:12px;border-radius:50%;flex:0 0 auto}
.model-card h3{margin:0;font-size:15px}
.model-card .prov{font-size:11px;color:var(--muted)}
.model-card .blurb{font-size:13px;color:var(--muted);flex:1}
.badges{display:flex;gap:5px;flex-wrap:wrap}
.badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);border:1px solid var(--line)}
.badge.free{background:color-mix(in oklab,#16a34a 18%,var(--panel));color:#15803d;border-color:#16a34a}
html[data-theme=dark] .badge.free{color:#86efac}
.model-actions{display:flex;gap:6px;flex-wrap:wrap}
.mbtn{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;font-weight:600}
.mbtn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.mbtn:hover{border-color:var(--accent)}
.path-box{margin-top:24px;background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:14px 16px;font-size:13px}
.path-box code{font-family:JetBrains Mono,monospace;direction:ltr;display:block;margin-top:6px;background:var(--soft);padding:8px 10px;border-radius:8px;overflow:auto}
.simple-foot{text-align:center;margin-top:20px}
.simple-foot button{border:none;background:none;color:var(--accent-ink);cursor:pointer;font-weight:700;text-decoration:underline;font-size:13.5px}

/* PRO LAYOUT */
.pro-only{display:none}.simple-only{display:block}
html[data-ux=pro] .pro-only{display:block}html[data-ux=pro] .simple-only{display:none}
html[data-ux=simple] .pro-chrome{display:none}

.tool-tabs{display:flex;gap:4px;flex-wrap:wrap;max-width:100%}
.tool-tab{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 10px;font-size:12px;cursor:pointer;font-weight:600}
.tool-tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.tool-tab .n{opacity:.7;font-size:10px;margin-inline-start:3px}
.layout{max-width:1360px;margin:0 auto;display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;padding:16px;align-items:start}
.sidebar{position:sticky;top:74px;max-height:calc(100vh - 90px);overflow:auto;scrollbar-width:thin}
.nav-group{margin-bottom:12px}
.nav-group-title{font-size:10.5px;font-weight:700;color:var(--muted);margin:0 10px 4px}
.nav-btn{display:flex;width:100%;text-align:start;border:none;background:transparent;padding:6px 10px;border-radius:8px;cursor:pointer;font-size:12.5px;color:var(--ink);font-weight:500;gap:6px}
.nav-btn:hover{background:var(--soft)}.nav-btn.active{background:var(--accent);color:#fff;font-weight:700}
.nav-btn .label{flex:1}.nav-btn .count{font-size:10.5px;opacity:.65}
.side-footer{border-top:1px solid var(--line);padding:10px;display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px}
.side-footer button{border:none;background:none;cursor:pointer;color:var(--muted);font-size:11.5px}
.side-footer button:hover{color:var(--accent-ink)}
.view-head{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.view-head h1{margin:0;font-size:20px;font-weight:800}.view-head p{margin:3px 0 0;color:var(--muted);font-size:13px}
.meta-pill{font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 10px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:8px 10px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.chip-btn{border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:5px 10px;font-size:11.5px;cursor:pointer;font-weight:600}
.chip-btn.active{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-ink)}
.toolbar select{border:1px solid var(--line);background:var(--soft);border-radius:8px;padding:5px 8px;font-size:12px}
.cmd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:10px}
.cmd-card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:var(--card-pad);box-shadow:var(--shadow);display:flex;flex-direction:column;gap:7px}
.cmd-card.pinned{border-color:var(--gold)}.cmd-card.focused{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}.cmd-card.copied{animation:flashCopy .45s ease}
.card-top{display:flex;align-items:center;gap:6px;min-width:0}
.cmd-name{font-family:JetBrains Mono,monospace;direction:ltr;font-size:12px;font-weight:600;background:var(--soft);border:1px solid var(--line);border-radius:7px;padding:4px 9px;cursor:pointer;color:var(--ink);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.cmd-name:hover{border-color:var(--accent);color:var(--accent-ink)}
.tier-badge{font-size:10.5px;font-weight:700;border-radius:999px;padding:2px 8px;white-space:nowrap}
.tier-3{background:var(--accent-soft);color:var(--accent-ink)}.tier-2{background:var(--gold-soft);color:var(--gold-ink)}.tier-1{background:var(--soft);color:var(--muted)}
.pin-btn{border:none;background:none;cursor:pointer;padding:3px;border-radius:6px;color:var(--muted)}.pin-btn.on{color:var(--accent)}
.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{font-size:10px;color:var(--muted);background:var(--soft);border-radius:999px;padding:1px 8px;border:1px solid var(--line)}
.chip.warn{color:var(--gold-ink);background:var(--gold-soft);border-color:var(--gold)}
.chip.sys{color:#fff;border-color:transparent}
.cmd-desc{font-size:12.5px;color:var(--muted)}
.note-input{border:1px dashed var(--line);background:transparent;border-radius:7px;padding:4px 9px;font-size:11.5px;width:100%;color:var(--ink);outline:none}
.note-input:focus{border-color:var(--accent);border-style:solid}
.mini-btn{border:1px solid var(--line);background:var(--soft);border-radius:7px;padding:3px 8px;font-size:10.5px;cursor:pointer}
.bulk-btn{border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);border-radius:10px;padding:7px 12px;font-size:12.5px;cursor:pointer;font-weight:600;margin-bottom:10px}
.empty-state{text-align:center;color:var(--muted);padding:48px 16px;background:var(--panel);border:1px dashed var(--line);border-radius:13px}
.guide-card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;box-shadow:var(--shadow);max-width:820px}
.guide-card h2{margin:0 0 8px;font-size:15px}.guide-card h2:not(:first-child){margin-top:16px}
.guide-card ul,.guide-card ol{margin:0;padding-inline-start:18px;color:var(--muted)}
.code-block{background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 12px;margin-top:5px;direction:ltr;text-align:left;font-family:JetBrains Mono,monospace;font-size:12px;color:var(--accent-ink);overflow:auto}
.callout{background:var(--accent-soft);border:1px solid var(--accent);border-radius:10px;padding:9px 12px;margin-top:12px;font-size:12.5px}
.site-footer{text-align:center;color:var(--muted);font-size:11px;padding:10px 16px 50px}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 18px;border-radius:999px;font-size:12.5px;z-index:60;opacity:0;pointer-events:none;max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toast.show{opacity:1;animation:toastIn .22s ease}
.to-top{position:fixed;bottom:20px;left:16px;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:none;place-items:center;box-shadow:var(--shadow);z-index:50}
.to-top.show{display:grid}
.sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:40}
body.nav-open .sidebar-backdrop{display:block}
.kbd-overlay{display:none;position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.4);align-items:center;justify-content:center;padding:16px}
.kbd-overlay.open{display:flex}
.kbd-panel{background:var(--panel);border-radius:16px;padding:20px;max-width:500px;width:100%;max-height:85vh;overflow:auto;border:1px solid var(--line)}
.kbd-panel table{width:100%;font-size:13px;border-collapse:collapse}
.kbd-panel td{padding:6px 4px;border-bottom:1px solid var(--line)}
.kbd-panel kbd{font-family:JetBrains Mono,monospace;font-size:11px;background:var(--soft);border:1px solid var(--line);border-radius:5px;padding:1px 6px}
.tips-banner{display:flex;gap:10px;background:var(--accent-soft);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:12.5px}
.recent-rail{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;font-size:11.5px;align-items:center}
.recent-chip{font-family:JetBrains Mono,monospace;direction:ltr;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 10px;cursor:pointer;font-size:11px}
@media(max-width:920px){
  .menu-btn{display:grid}.layout{grid-template-columns:1fr}
  .sidebar{position:fixed;top:0;right:0;bottom:0;width:min(280px,90vw);z-index:50;background:var(--panel);padding:14px;transform:translateX(105%);transition:.22s;border-left:1px solid var(--line)}
  body.nav-open .sidebar{transform:none}
  .tool-tabs{order:4;flex:1 1 100%}.search-wrap{order:5;flex:1 1 100%;max-width:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{.site-header,.sidebar,.toolbar,.simple-only,.icon-btn,.to-top,#toast{display:none!important}.layout{grid-template-columns:1fr}}

.lang-switch{display:flex;gap:2px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px}
.lang-switch button{border:none;background:transparent;padding:5px 9px;border-radius:999px;cursor:pointer;font-weight:800;font-size:11px;color:var(--muted);min-width:32px}
.lang-switch button.active{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
html[lang=en] body,html[lang=ru] body{font-family:Heebo,system-ui,"Segoe UI",Arial,sans-serif}
</style>
<!-- Phase 2 (Tauri desktop shell) addition — scoped styling for the native
     project-folder panel only. Nothing above this line was changed. -->
<style>
#desktopProjectPanel{margin:10px 16px 0;padding:10px 14px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);font-size:12.5px}
#desktopProjectPanel .dpp-row{margin:3px 0}
#desktopProjectPanel .dpp-muted{color:var(--muted)}
#desktopProjectPanel .dpp-path{color:var(--muted);font-family:"JetBrains Mono",monospace;font-size:11.5px;word-break:break-all}
#desktopProjectPanel .dpp-meta{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted)}
#desktopProjectPanel .dpp-ready{color:var(--accent-ink)}
</style>
<!-- Phase 7 addition: The Box chat screen styling. -->
<style>
#boxChatView{position:fixed;inset:0;z-index:35;background:var(--bg);display:flex;flex-direction:column}
.box-topbar{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
.box-topbar-title{flex:1;min-width:0}
.box-topbar-name{font-weight:800;font-size:14px}
.box-topbar-path{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;direction:ltr;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.box-link-btn{border:none;background:none;color:var(--accent-ink);cursor:pointer;font-weight:700;font-size:12.5px;text-decoration:underline}
.box-body{flex:1;min-height:0;display:flex;flex-direction:column;max-width:760px;width:100%;margin:0 auto;padding:16px;box-sizing:border-box}
.box-muted{color:var(--muted);font-size:13px}
.box-err{color:#f87171;font-size:12.5px;margin-top:6px}

.box-diagnostics{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:14px auto 0;max-width:480px}
.box-diag-pill{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:700;border-radius:999px;padding:4px 11px;border:1px solid var(--line);background:var(--panel)}
.box-diag-pill.ok{border-color:#16a34a;color:#15803d}
html[data-theme=dark] .box-diag-pill.ok{color:#86efac}
.box-diag-pill.missing{border-color:#dc2626;color:#dc2626}
html[data-theme=dark] .box-diag-pill.missing{color:#fca5a5}
.box-diag-hint{width:100%;text-align:center;font-size:11.5px;color:var(--muted);margin-top:4px}
.box-diag-hint a{color:var(--accent-ink)}

.box-project-picker{max-width:480px;margin:40px auto}
.box-project-picker h2{margin:0 0 4px;font-size:17px}
.box-project-picker button#boxAddProjectBtn{margin-top:14px;width:100%;padding:10px;border-radius:12px;border:1px solid var(--accent);background:var(--accent-soft);color:var(--accent-ink);font-weight:700;cursor:pointer;font-size:13.5px}
.box-project-list{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:6px}
.box-project-list li{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;cursor:pointer;box-shadow:var(--shadow)}
.box-project-list li:hover{border-color:var(--accent)}
.box-project-list .bpl-name{font-weight:700;font-size:13.5px}
.box-project-list .bpl-path{font-size:11px;color:var(--muted);font-family:"JetBrains Mono",monospace;direction:ltr;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.box-thread-wrap{flex:1;min-height:0;display:flex;flex-direction:column}
.box-thread{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:10px}
.box-bubble{max-width:88%;padding:10px 14px;border-radius:16px;font-size:13.5px;line-height:1.55;white-space:pre-wrap}
.box-bubble.user{align-self:flex-end;background:var(--accent);color:#fff;border-end-end-radius:4px}
.box-bubble.assistant{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-end-start-radius:4px;box-shadow:var(--shadow)}
.box-bubble.assistant:empty::after{content:"חושב…";color:var(--muted)}
.box-status-badge{align-self:flex-start;font-size:11px;font-weight:700;border-radius:999px;padding:3px 10px;margin-inline-start:4px}
.box-status-badge.running{background:var(--gold-soft);color:var(--gold-ink)}
.box-status-badge.success{background:color-mix(in oklab,#16a34a 18%,var(--panel));color:#15803d}
.box-status-badge.error{background:color-mix(in oklab,#dc2626 18%,var(--panel));color:#dc2626}
html[data-theme=dark] .box-status-badge.success{color:#86efac}
html[data-theme=dark] .box-status-badge.error{color:#fca5a5}

.box-plan-card{align-self:flex-start;max-width:88%;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);font-size:13px}
.box-plan-card .bpc-risk{font-size:10.5px;font-weight:800;border-radius:999px;padding:2px 9px;display:inline-block;margin-bottom:6px}
.box-plan-card .bpc-risk.low{background:color-mix(in oklab,#16a34a 18%,var(--panel));color:#15803d}
.box-plan-card .bpc-risk.medium{background:var(--gold-soft);color:var(--gold-ink)}
.box-plan-card .bpc-risk.high{background:color-mix(in oklab,#dc2626 18%,var(--panel));color:#dc2626}
.box-plan-card ol{margin:0;padding-inline-start:18px}
.box-plan-card .bpc-actions{display:flex;gap:8px;margin-top:10px}
.box-plan-card button{border-radius:9px;padding:6px 14px;font-size:12.5px;font-weight:700;cursor:pointer}
.box-plan-card .bpc-approve{border:1px solid var(--accent);background:var(--accent);color:#fff}
.box-plan-card .bpc-reject{border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.box-plan-card.decided{opacity:.6}

.box-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.box-chip{font-size:10.5px;background:var(--soft);border:1px solid var(--line);border-radius:999px;padding:2px 9px;color:var(--muted);font-family:"JetBrains Mono",monospace;direction:ltr}
.box-cancel-btn{align-self:flex-start;border:1px solid #dc2626;background:transparent;color:#dc2626;border-radius:9px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.box-retry-btn{align-self:flex-start;border:1px solid var(--line);background:var(--soft);color:var(--ink);border-radius:9px;padding:5px 12px;font-size:12px;cursor:pointer}

.box-composer{display:flex;gap:8px;align-items:flex-end;border-top:1px solid var(--line);padding-top:12px;margin-top:8px}
.box-composer textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:14px;padding:10px 14px;font-family:inherit;font-size:13.5px;background:var(--panel);color:var(--ink);outline:none}
.box-composer textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.box-composer button{border:none;background:var(--accent);color:#fff;border-radius:12px;padding:0 20px;height:40px;font-weight:700;cursor:pointer;font-size:13px}
.box-composer button:disabled{opacity:.5;cursor:default}
</style>
</head>
<body>
<header class="site-header">

    <button class="icon-btn menu-btn pro-chrome" id="menuBtn" type="button" aria-label="Menu">☰</button>

      <button type="button" data-lang="he" class="active" title="עברית">HE</button>
      <button type="button" data-lang="en" title="English">EN</button>
      <button type="button" data-lang="ru" title="Русский">RU</button>
    </div>
    <div class="mode-switch" role="group">
      <button type="button" id="modeSimple" class="active">Simple</button>
      <button type="button" id="modePro">Pro</button>
    </div>
    <div class="tool-tabs pro-chrome pro-only" id="toolTabs"></div>
    <div class="search-wrap pro-chrome">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="searchInput" placeholder="Search..." autocomplete="off" aria-label="Search">
    </div>
    <button class="icon-btn pro-chrome pro-only" id="densityBtn" type="button" title="Density">☰☰</button>
    <button class="icon-btn" id="helpBtn" type="button" title="Help">?</button>
    <button class="icon-btn" id="themeToggle" type="button" title="Theme">☾</button>
    <!-- Phase 2 addition: hidden unless running inside the Tauri desktop shell -->
    <button class="icon-btn" id="desktopProjectBtn" type="button" title="Project Folder" hidden>📁</button>
    <!-- Phase 3 addition: internal DB debug screen, hidden unless running inside the Tauri desktop shell -->
    <button class="icon-btn" id="dbDebugBtn" type="button" title="DB Debug" hidden>🛠️</button>
    <!-- Phase 7 addition: The Box chat screen, hidden unless running inside the Tauri desktop shell -->
    <button class="icon-btn" id="boxChatBtn" type="button" title="The Box" hidden>💬</button>
  </div>
</header>

<!-- Phase 2 addition: populated by tauri-bridge.js, empty/hidden on the web -->
<div id="desktopProjectPanel" hidden></div>

<!-- Phase 7 addition: The Box chat screen — the actual end-user-facing
     feature the whole project vision was for. Deliberately NOT wired into
     the existing T/DATA translation object: that object lives on a single
     minified line tens of thousands of tokens long (see CLAUDE.md's own
     warning about this pattern in the sibling portfolio.html file), which
     is unsafe to hand-edit with normal tooling. Hebrew-only for now — the
     app's default and primary language — with EN/RU left as follow-up
     work once there's a safer way to touch the translation blob. Toggled
     independently of the Simple/Pro catalog UI: opening it hides
     #simpleHome / .pro-only / the footer via inline style, closing it
     restores them; it never touches `data-ux`. -->
<div id="boxChatView" dir="rtl" lang="he" hidden>
  <div class="box-topbar">
    <button type="button" id="boxBackBtn" class="icon-btn" title="חזרה">→</button>
    <div class="box-topbar-title">
      <div class="box-topbar-name" id="boxProjectName">The Box</div>
      <div class="box-topbar-path" id="boxProjectPath"></div>
    </div>
    <button type="button" id="boxSwitchProjectBtn" class="box-link-btn" hidden>החלף פרויקט</button>
  </div>

  <div class="box-body">
    <!-- Phase 9 addition: install diagnostics (doc 08 scenario 2), shown to
         every user up front — a brand-new user needs to know if Claude
         Code/Codex/Git aren't installed before anything else here can
         possibly work. -->
    <div id="boxDiagnostics" class="box-diagnostics"></div>
    <div class="box-connections" style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px;border-bottom:1px solid var(--border)">
      <label for="boxToolSelect">הכלי שלי</label>
      <select id="boxToolSelect" style="padding:8px;border-radius:8px">
        <option value="claude">Claude — החשבון הקיים</option>
        <option value="codex">Codex — החשבון הקיים</option>
        <option value="grok">Grok — החשבון הקיים</option>
        <option value="ollama">Ollama — מקומי</option>
        <option value="gemini">Gemini — Google / API</option>
        <option value="deepseek">DeepSeek — API בתשלום</option>
      </select>
      <button type="button" id="boxConnectBtn">התחברות / בדיקת חשבון</button>
      <label><input type="checkbox" id="boxWorkMode"> עבודת קוד עם תוכנית ואישור (Claude)</label>
      <span class="box-muted">ברירת המחדל: שיחה בלבד, ללא שינוי קבצים. הכלי, הפרויקט והשיחה נשמרים.</span>
    </div>

    <div id="boxProjectPicker" class="box-project-picker">
      <h2>על איזה פרויקט נעבוד?</h2>
      <p class="box-muted">בחרו תיקיית פרויקט קיימת, או הוסיפו אחת חדשה.</p>
      <button type="button" id="boxAddProjectBtn">+ הוסף פרויקט (בחירת תיקייה)</button>
      <div id="boxAddProjectErr" class="box-err"></div>
      <ul id="boxProjectList" class="box-project-list"></ul>
    </div>

    <div id="boxThreadWrap" class="box-thread-wrap" hidden>
      <div id="boxThread" class="box-thread"></div>

      <div class="box-composer">
        <textarea id="boxComposerInput" rows="2" placeholder="מה תרצו שאעשה? לדוגמה: תוסיף כפתור התחברות לעמוד הבית"></textarea>
        <button type="button" id="boxSendBtn">שלח</button>
      </div>
      <div id="boxComposerErr" class="box-err"></div>
    </div>
  </div>
</div>

    const s=JSON.parse(localStorage.getItem('claude_cc_ui_v1')||'{}');
    const lang = ['he','en','ru'].includes(s.lang)?s.lang: detectLang();
    return {
      system: SYSTEMS.some(x=>x[0]===s.system)?s.system:'all',
      currentCat: CATEGORIES[s.currentCat]?s.currentCat:'hub_easy',
      recent: Array.isArray(s.recent)?s.recent.slice(0,8):[],
      sort:s.sort||'stars', density:s.density==='compact'?'compact':'comfy',
      filters: Object.assign({essential:false,pinned:false,warn:false,hidden:false}, s.filters||{}),
      ux: s.ux==='pro'?'pro':'simple',
      lang,
    };
  }catch(_){return {system:'all',currentCat:'hub_easy',recent:[],sort:'stars',density:'comfy',filters:{essential:false,pinned:false,warn:false,hidden:false},ux:'simple',lang:detectLang()}}
}
function detectLang(){
  const nav=(navigator.language||'he').toLowerCase();
  if(nav.startsWith('ru')) return 'ru';
  if(nav.startsWith('en')) return 'en';
  if(nav.startsWith('he')||nav.startsWith('iw')) return 'he';
  return 'he';
}
function saveUi(){
  try{localStorage.setItem('claude_cc_ui_v1',JSON.stringify({
    system:state.system,currentCat:state.currentCat,recent:state.recent,sort:state.sort,
    density:state.density,filters:state.filters,ux:state.ux,lang:state.lang
  }))}catch(_){}
}
function loadTheme(){
  try{const t=localStorage.getItem('claude_cc_theme'); if(t==='dark'||t==='light') return t}catch(_){}
  return matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
}
function applyTheme(th){
  state.theme=th; document.documentElement.setAttribute('data-theme',th);
  document.getElementById('themeToggle').textContent=th==='dark'?'☀':'☾';
  try{localStorage.setItem('claude_cc_theme',th)}catch(_){}
}
function applyDensity(){
  document.documentElement.setAttribute('data-density',state.density==='compact'?'compact':'comfy');
  document.getElementById('densityBtn')?.classList.toggle('on',state.density==='compact');
}
function applyLang(){
  const rtl = state.lang==='he';

}
function applyUx(){
  document.documentElement.setAttribute('data-ux', state.ux);
  document.getElementById('modeSimple').classList.toggle('active', state.ux==='simple');
  document.getElementById('modePro').classList.toggle('active', state.ux==='pro');
}
function applyToolAccent(){
  document.documentElement.style.setProperty('--accent', SYS_COLOR[state.system]||'var(--claude)');
}

let toastTimer=null;
function showToast(msg){
  const el=document.getElementById('toast');
  if(toastTimer) clearTimeout(toastTimer);
  el.textContent=msg; el.classList.add('show');
  toastTimer=setTimeout(()=>el.classList.remove('show'),1800);
}
function doCopy(text,msg){
  const done=()=>showToast(msg||(t('copied')+' '+text));
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(text).then(done).catch(fb);
  else fb();
  function fb(){const ta=document.createElement('textarea');ta.value=text;document.body.appendChild(ta);ta.select();try{document.execCommand('copy')}catch(_){}ta.remove();done()}
}
function copyCommand(text, cardEl){
  doCopy(text);
  state.recent=[text,...state.recent.filter(x=>x!==text)].slice(0,8);
  saveUi(); if(state.ux==='pro') renderRecent();
  if(cardEl){cardEl.classList.remove('copied'); void cardEl.offsetWidth; cardEl.classList.add('copied')}
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function highlight(text,q){
  const s=esc(text); if(!q) return s;
  try{
    const safe=q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    return s.replace(new RegExp('('+safe+')','gi'),'<mark class="hl">$1</mark>');
  }catch(_){return s}
}
function closeNav(){document.body.classList.remove('nav-open')}
function countForSystem(sys){return sys==='all'?state.cmds.length:state.cmds.filter(c=>c.system===sys).length}
function cmdsInScope(){return state.system==='all'?state.cmds:state.cmds.filter(c=>c.system===state.system)}
function crossSystems(name){return [...new Set(state.cmds.filter(c=>c.name===name).map(c=>c.system))]}
function tierOf(stars){
  if(stars>=3) return {label:t('tier3'),cls:'tier-3'};
  if(stars===2) return {label:t('tier2'),cls:'tier-2'};
  return {label:t('tier1'),cls:'tier-1'};
}

function setSystem(sys){
  if(!SYSTEMS.some(x=>x[0]===sys)) return;
  state.system=sys;
  const g=GROUPS[state.system]||GROUPS.all;
  if(state.currentCat!=='pinned'&&state.currentCat!=='guide'){
    if(!g.some(x=>x.cats.includes(state.currentCat)))
      state.currentCat=(g.flatMap(x=>x.cats).find(c=>c!=='pinned'&&c!=='guide'))||'daily';
  }
  state.search=''; document.getElementById('searchInput').value='';
  state.focusIdx=-1; applyToolAccent(); saveUi(); render();
}

function renderToolTabs(){
  const el=document.getElementById('toolTabs');
  el.innerHTML = SYSTEMS.map(([id])=>{
    const n=countForSystem(id);
    return `<button type="button" class="tool-tab${state.system===id?' active':''}" data-sys="${id}">${esc(sysLabel(id))}<span class="n">${n}</span></button>`;
  }).join('');
  el.querySelectorAll('[data-sys]').forEach(b=>b.addEventListener('click',()=>setSystem(b.dataset.sys)));
}

function renderNav(){
  const searching=state.search.trim().length>0;
  const scope=cmdsInScope();
  const pinnedCount=scope.filter(c=>c.pinned).length;
  const glist=GROUPS[state.system]||GROUPS.all;
  const root=document.getElementById('navGroups');
  root.innerHTML=glist.map(g=>{
    const title=tl(g.title)?`<div class="nav-group-title">${esc(tl(g.title))}</div>`:'';
    const items=g.cats.map(key=>{
      if(!CATEGORIES[key]) return '';
      const active=!searching&&state.currentCat===key;
      let count=0;
      if(key==='pinned') count=pinnedCount;
      else if(key==='guide') count=0;
      else count=scope.filter(c=>c.cat===key).length;
      return `<button type="button" class="nav-btn${active?' active':''}" data-cat="${esc(key)}"><span class="label">${esc(catLabel(key))}</span>${count?`<span class="count">${count}</span>`:''}</button>`;
    }).join('');
    return `<div class="nav-group">${title}<div>${items}</div></div>`;
  }).join('');
  root.querySelectorAll('[data-cat]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      state.currentCat=btn.dataset.cat; state.search='';
      document.getElementById('searchInput').value=''; state.focusIdx=-1;
      saveUi(); closeNav(); render(); window.scrollTo({top:0,behavior:'smooth'});
    });
  });
}

function renderRecent(){
  const rail=document.getElementById('recentRail');
  const chips=document.getElementById('recentChips');
  if(!state.recent.length||state.currentCat==='guide'){rail.hidden=true;return}
  rail.hidden=false;
  chips.innerHTML=state.recent.map(x=>`<button type="button" class="recent-chip" data-copy="${esc(x)}">${esc(x)}</button>`).join('');
  chips.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',()=>copyCommand(b.dataset.copy)));
}

function applyFilters(list){
  const f=state.filters;
  return list.filter(c=>{
    if(f.essential&&c.stars<3) return false;
    if(f.pinned&&!c.pinned) return false;
    if(f.warn&&!(c.warn||c.hidden)) return false;
    if(f.hidden&&!c.hidden) return false;
    return true;
  });
}
function sortList(list){
  const recentIdx=new Map(state.recent.map((x,i)=>[x,i]));
  return list.slice().sort((a,b)=>{
    if(a.pinned!==b.pinned) return a.pinned?-1:1;
    if(state.sort==='name') return a.name.localeCompare(b.name);
    if(state.sort==='system'){const s=a.system.localeCompare(b.system); if(s) return s}
    if(state.sort==='recent'){
      const ra=recentIdx.has(a.name)?recentIdx.get(a.name):999;
      const rb=recentIdx.has(b.name)?recentIdx.get(b.name):999;
      if(ra!==rb) return ra-rb;
    }
    if(b.stars!==a.stars) return b.stars-a.stars;
    return a.name.localeCompare(b.name);
  });
}
function getVisibleList(){
  const searching=state.search.trim().length>0;
  const scope=cmdsInScope();
  let list=[];
  if(searching){
    const s=state.search.trim().toLowerCase();
    list=scope.filter(c=>
      c.name.toLowerCase().includes(s)||
      cmdDesc(c).toLowerCase().includes(s)||
      (c.note&&c.note.toLowerCase().includes(s))||
      sysLabel(c.system).toLowerCase().includes(s)||
      catLabel(c.cat).toLowerCase().includes(s)
    );
  } else if(state.currentCat==='pinned') list=scope.filter(c=>c.pinned);
  else if(state.currentCat==='guide') list=[];
  else list=scope.filter(c=>c.cat===state.currentCat);
  return sortList(applyFilters(list));
}

function togglePin(id){
  state.cmds=state.cmds.map(c=>c.id===id?{...c,pinned:!c.pinned}:c);
  const cmd=state.cmds.find(c=>c.id===id);
  saveStorage(); showToast(cmd.pinned?t('addedPin'):t('removedPin')); render();
}

  grid.innerHTML=list.map((c,idx)=>{
    const tier=tierOf(c.stars);
    const warn=c.hidden?t('unverified'):(c.warn?t('caution'):'');
    const cross=crossSystems(c.name).filter(s=>s!==c.system);
    const col=SYS_COLOR[c.system]||'var(--muted)';
    return `<article class="cmd-card${c.pinned?' pinned':''}${state.focusIdx===idx?' focused':''}" data-idx="${idx}" data-id="${esc(c.id)}">
      <div class="card-top">
        <button type="button" class="cmd-name" data-copy="${esc(c.name)}">${highlight(c.name,q)}</button>
        <span style="flex:1"></span>
        <span class="tier-badge ${tier.cls}">${esc(tier.label)}</span>
        <button type="button" class="pin-btn${c.pinned?' on':''}" data-id="${esc(c.id)}">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="${c.pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M6 3h12v18l-6-4.4L6 21z"/></svg>
        </button>
      </div>
      <div class="chips">
        <span class="chip sys" style="background:${col}">${esc(sysLabel(c.system))}</span>
        ${showChips?`<span class="chip">${esc(catLabel(c.cat))}</span>`:''}
        ${warn?`<span class="chip warn">${esc(warn)}</span>`:''}
        ${cross.slice(0,3).map(s=>`<button type="button" class="chip" data-jump="${s}" style="cursor:pointer;border-style:dashed">${esc(t('alsoIn'))} ${esc(sysLabel(s))}</button>`).join('')}
      </div>
      <div class="cmd-desc">${highlight(cmdDesc(c),q)}</div>
      <input class="note-input" data-id="${esc(c.id)}" value="${esc(c.note)}" placeholder="${esc(t('notePh'))}">
      <div style="display:flex;gap:6px">
        <button type="button" class="mini-btn" data-copy="${esc(c.name)}">${esc(t('copy'))}</button>
        ${c.note?`<button type="button" class="mini-btn" data-copy="${esc(c.name+'\n// '+c.note)}">${esc(t('copyNote'))}</button>`:''}
      </div>
    </article>`;
  }).join('');
  grid.querySelectorAll('[data-copy]').forEach(b=>b.addEventListener('click',e=>copyCommand(b.dataset.copy, e.currentTarget.closest('.cmd-card'))));
  grid.querySelectorAll('.pin-btn').forEach(b=>b.addEventListener('click',()=>togglePin(b.dataset.id)));
  grid.querySelectorAll('.note-input').forEach(inp=>inp.addEventListener('input',()=>{
    state.cmds=state.cmds.map(c=>c.id===inp.dataset.id?{...c,note:inp.value}:c); saveStorage();
  }));
  grid.querySelectorAll('[data-jump]').forEach(b=>b.addEventListener('click',()=>setSystem(b.dataset.jump)));
}

function renderPro(){
  paintStaticUi();
  const searching=!!state.search.trim();
  const showGuide=!searching&&state.currentCat==='guide';
  renderToolTabs(); renderNav(); renderRecent(); applyToolAccent();
  document.getElementById('filterEssential').classList.toggle('active',state.filters.essential);
  document.getElementById('filterPinned').classList.toggle('active',state.filters.pinned);
  document.getElementById('filterWarn').classList.toggle('active',state.filters.warn);
  document.getElementById('filterHidden').classList.toggle('active',state.filters.hidden);
  document.getElementById('sortSelect').value=state.sort;
  document.getElementById('guidePanel').hidden=!showGuide;
  document.getElementById('listPanel').hidden=showGuide;
  document.getElementById('toolbar').hidden=showGuide;

  if(showGuide){
    document.getElementById('guidePanel').innerHTML=guideHtml();
    document.getElementById('viewTitle').textContent=catLabel('guide');
    document.getElementById('viewDesc').textContent=catDesc('guide');
    document.getElementById('viewMeta').innerHTML='';
    state.lastList=[];
  } else {
    const list=getVisibleList();
    state.lastList=list;
    if(state.focusIdx>=list.length) state.focusIdx=list.length?0:-1;
    document.getElementById('viewTitle').textContent=searching?`${t('resultsFor')} "${state.search.trim()}"`:catLabel(state.currentCat);
    document.getElementById('viewDesc').textContent=searching?`${list.length} ${t('results')}`:catDesc(state.currentCat);
    document.getElementById('viewMeta').innerHTML=`<span class="meta-pill">${list.length} ${t('showing')}</span><span class="meta-pill">${countForSystem(state.system)} ${t('inTool')}</span><span class="meta-pill">${state.cmds.filter(c=>c.pinned).length} ${t('pins')}</span>`;
    document.getElementById('copyPinnedBtn').hidden=!(state.currentCat==='pinned'&&list.length);
    document.getElementById('copyVisibleBtn').hidden=list.length<2;
    const empty=document.getElementById('emptyState');

      document.getElementById('cmdGrid').innerHTML='';
      empty.hidden=false; empty.textContent=searching?t('emptySearch'):t('empty');
    } else { empty.hidden=true; renderCards(list); }
  }
  document.getElementById('siteFooter').textContent=
    t('footerPro').replace('{n}',state.cmds.length).replace('{m}',MODELS.length);

function render(){
  applyLang(); applyUx();
  if(state.ux==='simple') renderSimple();
  else renderPro();
}

function cycleLang(){
  const order=['he','en','ru'];
  state.lang=order[(order.indexOf(state.lang)+1)%3];
  saveUi(); render();
}

function setLang(lang){
  if(!['he','en','ru'].includes(lang)) return;
  state.lang=lang; saveUi(); render();
}

function exportMarkdown(){
  const src=state.cmds.filter(c=>c.pinned);
  const list=src.length?src:getVisibleList();
  const lines=['# AI Command Hub',''];
  let cur='';
  list.forEach(c=>{
    if(c.system!==cur){cur=c.system; lines.push('## '+sysLabel(c.system),'')}
    lines.push(`- \`${c.name}\` — ${cmdDesc(c)}`);
  });
  const blob=new Blob([lines.join('\n')],{type:'text/markdown'});
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download='ai-hub.md'; a.click(); URL.revokeObjectURL(url);
  showToast(t('mdOk'));
}

function wireEvents(){
  document.querySelectorAll('.lang-switch [data-lang]').forEach(b=>{
    b.addEventListener('click',()=>setLang(b.dataset.lang));
  });
  document.getElementById('modeSimple').addEventListener('click',()=>{state.ux='simple';saveUi();render()});
  document.getElementById('modePro').addEventListener('click',()=>{state.ux='pro';saveUi();render()});
  document.getElementById('goProFromSimple').addEventListener('click',()=>{state.ux='pro';saveUi();render()});
  document.getElementById('copyPathBtn').addEventListener('click',()=>doCopy(TERM_PATH,t('pathCopied')));
  document.getElementById('copyStartBtn').addEventListener('click',()=>copyCommand('START-HERE.bat'));

  const search=document.getElementById('searchInput');
  let st=null;
  search.addEventListener('input',()=>{
    clearTimeout(st);
    st=setTimeout(()=>{
      state.search=search.value; state.focusIdx=-1;
      if(state.ux==='simple' && state.search.trim()){ state.ux='pro'; applyUx(); }
      saveUi(); render();
    },120);
  });
  document.getElementById('themeToggle').addEventListener('click',()=>applyTheme(state.theme==='light'?'dark':'light'));
  document.getElementById('densityBtn').addEventListener('click',()=>{state.density=state.density==='compact'?'comfy':'compact';applyDensity();saveUi()});
  document.getElementById('helpBtn').addEventListener('click',()=>{const o=document.getElementById('kbdOverlay');o.hidden=false;o.classList.add('open')});
  document.getElementById('kbdClose').addEventListener('click',()=>{const o=document.getElementById('kbdOverlay');o.classList.remove('open');o.hidden=true});
  document.getElementById('kbdOverlay').addEventListener('click',e=>{if(e.target.id==='kbdOverlay'){e.currentTarget.classList.remove('open');e.currentTarget.hidden=true}});
  document.getElementById('menuBtn').addEventListener('click',()=>document.body.classList.toggle('nav-open'));
  document.getElementById('sidebarBackdrop').addEventListener('click',closeNav);

  const fmap={filterEssential:'essential',filterPinned:'pinned',filterWarn:'warn',filterHidden:'hidden'};
  Object.entries(fmap).forEach(([id,key])=>{
    document.getElementById(id).addEventListener('click',()=>{state.filters[key]=!state.filters[key];state.focusIdx=-1;saveUi();render()});
  });
  document.getElementById('sortSelect').addEventListener('change',e=>{state.sort=e.target.value;saveUi();render()});
  document.getElementById('copyPinnedBtn').addEventListener('click',()=>{
    const p=cmdsInScope().filter(c=>c.pinned);
    if(p.length) doCopy(p.map(c=>`[${sysLabel(c.system)}] ${c.name} — ${cmdDesc(c)}`).join('\n'));
  });
  document.getElementById('copyVisibleBtn').addEventListener('click',()=>{
    if(state.lastList.length) doCopy(state.lastList.map(c=>`[${sysLabel(c.system)}] ${c.name} — ${cmdDesc(c)}`).join('\n'));
  });
  document.getElementById('exportBtn').addEventListener('click',()=>{
    const blob=new Blob([JSON.stringify(state.cmds.map(({id,pinned,note})=>({id,pinned,note})),null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='ai-hub-backup.json';a.click();URL.revokeObjectURL(url);showToast(t('backedUp'));
  });
  document.getElementById('exportMdBtn').addEventListener('click',exportMarkdown);
  document.getElementById('importBtn').addEventListener('click',()=>{
    const input=document.createElement('input');input.type='file';input.accept='.json';
    input.onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=ev=>{
      try{const data=JSON.parse(ev.target.result);if(!Array.isArray(data))throw 0;const map={};data.forEach(s=>map[s.id]=s);
        state.cmds=fresh().map(c=>{let s=map[c.id];if(!s&&c.system==='claude')s=map[makeLegacyId(c.cat,c.name)];return s?{...c,pinned:!!s.pinned,note:s.note||''}:c});
        saveStorage();showToast(t('restored'));render()}catch(_){showToast(t('badFile'))}
    };rd.readAsText(f)};input.click();
  });
  document.getElementById('resetBtn').addEventListener('click',()=>{
    if(confirm(t('resetQ'))){state.cmds=fresh();saveStorage();showToast(t('resetOk'));render()}
  });
  const tips=document.getElementById('tipsBanner');
  try{if(!localStorage.getItem('claude_cc_tips_v3')) tips.hidden=false}catch(_){tips.hidden=false}
  document.getElementById('tipsClose').addEventListener('click',()=>{tips.hidden=true;try{localStorage.setItem('claude_cc_tips_v3','1')}catch(_){}});
  const toTop=document.getElementById('toTop');
  window.addEventListener('scroll',()=>toTop.classList.toggle('show',scrollY>400),{passive:true});
  toTop.addEventListener('click',()=>scrollTo({top:0,behavior:'smooth'}));

  document.addEventListener('keydown',e=>{
    const tag=(e.target.tagName||'').toLowerCase();
    const typing=tag==='input'||tag==='textarea'||e.target.isContentEditable;
    const ov=document.getElementById('kbdOverlay').classList.contains('open');
    if(ov){if(e.key==='Escape'||e.key==='?'){e.preventDefault();document.getElementById('kbdOverlay').classList.remove('open');document.getElementById('kbdOverlay').hidden=true}return}
    if((e.key==='/'&&!typing)||(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey))){e.preventDefault();search.focus();search.select();return}
    if(e.key==='?'&&!typing){e.preventDefault();document.getElementById('kbdOverlay').hidden=false;document.getElementById('kbdOverlay').classList.add('open');return}
    if(e.key==='Escape'){if(document.body.classList.contains('nav-open')){closeNav();return} if(state.search){state.search='';search.value='';render()}}
    if(typing) return;
    if(e.key.toLowerCase()==='l'&&!e.ctrlKey){e.preventDefault();cycleLang();return}
    if(e.key.toLowerCase()==='s'&&!e.ctrlKey){e.preventDefault();state.ux=state.ux==='simple'?'pro':'simple';saveUi();render();return}
    if(e.key.toLowerCase()==='t'&&!e.ctrlKey){e.preventDefault();applyTheme(state.theme==='light'?'dark':'light');return}
    if(e.key.toLowerCase()==='d'&&!e.ctrlKey&&state.ux==='pro'){e.preventDefault();state.density=state.density==='compact'?'comfy':'compact';applyDensity();saveUi();return}
    if(state.ux!=='pro') return;
    if(e.key>='1'&&e.key<='9'&&!e.ctrlKey){const i=+e.key-1; if(SYSTEMS[i]){e.preventDefault();setSystem(SYSTEMS[i][0]);return}}
    const n=state.lastList.length; if(!n) return;
    if(e.key==='ArrowDown'){e.preventDefault();state.focusIdx=state.focusIdx<0?0:Math.min(n-1,state.focusIdx+1);document.querySelectorAll('.cmd-card').forEach((c,i)=>c.classList.toggle('focused',i===state.focusIdx));document.querySelector(`.cmd-card[data-idx="${state.focusIdx}"]`)?.scrollIntoView({block:'nearest'});return}
    if(e.key==='ArrowUp'){e.preventDefault();state.focusIdx=state.focusIdx<0?n-1:Math.max(0,state.focusIdx-1);document.querySelectorAll('.cmd-card').forEach((c,i)=>c.classList.toggle('focused',i===state.focusIdx));document.querySelector(`.cmd-card[data-idx="${state.focusIdx}"]`)?.scrollIntoView({block:'nearest'});return}
    if(e.key==='Enter'&&state.focusIdx>=0){e.preventDefault();const cmd=state.lastList[state.focusIdx];const card=document.querySelector(`.cmd-card[data-idx="${state.focusIdx}"]`);if(cmd)copyCommand(cmd.name,card);return}
    if(e.key.toLowerCase()==='p'&&state.focusIdx>=0){e.preventDefault();const cmd=state.lastList[state.focusIdx];if(cmd)togglePin(cmd.id)}
  });
}

function init(){
  state.cmds=loadStorage();
  const ui=loadUi();
  Object.assign(state,{system:ui.system,currentCat:ui.currentCat,recent:ui.recent,sort:ui.sort,density:ui.density,filters:ui.filters,ux:ui.ux,lang:ui.lang});
  applyTheme(loadTheme()); applyDensity(); applyLang(); applyUx(); applyToolAccent();
  wireEvents(); render();
  setTimeout(()=>showToast(
    state.ux==='simple'
      ? t('toastSimple').replace('{m}', String(MODELS.length))
      : t('toastPro').replace('{n}', String(state.cmds.length))
  ),400);
}
init();
