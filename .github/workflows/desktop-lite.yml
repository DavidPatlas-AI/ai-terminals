name: The Box Lite · desktop builds
on:
  workflow_dispatch:
  push:
    branches: ['test/the-box-lite-*']
    paths: ['desktop-app/src/**', 'desktop-app/src-tauri/**', 'desktop-app/tests/**', 'desktop-app/package*.json', '.github/workflows/desktop-lite.yml']
permissions:
  contents: read
jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows ARM64
            runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            bundles: nsis
          - name: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - name: macOS Apple Silicon
            runner: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - name: Linux x64
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,appimage
          - name: Linux ARM64
            runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: deb
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: desktop-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop-app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-app/src-tauri -> target
      - run: npm ci
      - run: npm run test:ui
      - name: Render desktop and narrow-window previews
        if: matrix.name == 'Linux x64'
        run: |
          mkdir -p visual-checks
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --no-first-run --virtual-time-budget=2000 --window-size=1360,850 --screenshot=visual-checks/desktop.png "file://$PWD/src/lite.html"
          google-chrome --headless --no-sandbox --disable-gpu --hide-scrollbars --no-first-run --virtual-time-budget=2000 --window-size=430,850 --screenshot=visual-checks/narrow.png "file://$PWD/src/lite.html"
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'Linux x64'
        with:
          name: the-box-lite-visual-previews
          path: desktop-app/visual-checks/
          if-no-files-found: error
          retention-days: 14
      - name: Tests without live accounts
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build platform installer
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
      - name: Smoke test production worker
        run: node tests/worker-smoke.cjs src-tauri/target/${{ matrix.target }}/release/desktop-app
      - name: Verify Windows installer lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tests/install-smoke.ps1 -Target ${{ matrix.target }}
      - name: Verify Linux and macOS packages
        if: runner.os != 'Windows'
        run: bash tests/install-smoke.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: the-box-lite-${{ matrix.target }}-unsigned
          path: desktop-app/src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare Windows portable application
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force portable | Out-Null
          Copy-Item -LiteralPath "src-tauri/target/${{ matrix.target }}/release/desktop-app.exe" -Destination portable/TheBoxLite.exe
          Set-Content -LiteralPath portable/README.txt -Value 'The Box Lite 0.2 — test build, not digitally signed. Requires Microsoft WebView2. Uses your existing CLI accounts. No installer is required for this portable copy.'
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: the-box-lite-${{ matrix.target }}-portable-unsigned
          path: desktop-app/portable/
          if-no-files-found: error
          retention-days: 14
